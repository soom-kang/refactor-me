name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check source syntax
        run: |
          for file in tool/*.mjs tool/bin/*.mjs tool/src/*.mjs tool/test/*.mjs tool/fixtures/*.mjs; do
            node --check "$file" || exit 1
          done
      - name: Run local tests
        run: node --test tool/test/*.test.mjs
      - name: Check CLI
        run: |
          node tool/bin/refactor-me.mjs help
          node tool/bin/refactor-me.mjs version --json
      - name: Match release tag to runtime version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { VERSION } from "./tool/src/version.mjs";
            assert.equal(process.env.GITHUB_REF_NAME, `v${VERSION}`);
          '
