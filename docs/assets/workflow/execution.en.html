<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run, then inspect the outcome.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#FDF7EC}svg{display:block;width:960px;height:auto;max-width:100%;}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="execution-en-title execution-en-desc">
<title id="execution-en-title">Run, then inspect the outcome.</title>
<desc id="execution-en-desc">After prerequisite checks and an isolated run, inspect published changes for exit 0, or diagnostics and retained evidence for exits 2 and 4.</desc>
<defs>
<marker id="execution-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#625B52"/>
</marker>
</defs>
<rect width="960" height="760" fill="#FDF7EC"/>
<text x="48" y="47" font-family="'Geist Mono',monospace" font-size="13" font-weight="500" fill="#625B52" text-anchor="start">REFACTOR-ME / EXECUTION</text>
<text x="48" y="98" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="32" font-weight="600" fill="#050505" text-anchor="start">Run, then inspect the outcome.</text>
<path d="M 304 244 V 279" fill="none" stroke="#625B52" stroke-width="1.8" marker-end="url(#execution-en-arrow)"/>
<path d="M 304 385 V 418" fill="none" stroke="#625B52" stroke-width="1.8" marker-end="url(#execution-en-arrow)"/>
<path d="M 424 480 H 594" fill="none" stroke="#625B52" stroke-width="1.8" marker-end="url(#execution-en-arrow)"/>
<path d="M 304 542 V 596" fill="none" stroke="#625B52" stroke-width="1.8" marker-end="url(#execution-en-arrow)"/>
<rect x="48" y="145" width="512" height="99" rx="8" fill="#FDF7EC" stroke="#CFC7BB" stroke-width="1.2"/>
<text x="70" y="180" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="600" fill="#050505" text-anchor="start">1  Check prerequisites</text>
<text x="70" y="210" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#625B52" text-anchor="start">doctor · repository / Skills / provider</text>
<rect x="48" y="285" width="512" height="100" rx="8" fill="#FAE8DB" stroke="#DE5C20" stroke-width="2"/>
<text x="70" y="320" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="600" fill="#050505" text-anchor="start">2  Run in an isolated worktree</text>
<text x="70" y="350" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#625B52" text-anchor="start">run · audit → edit → validate → review</text>
<path d="M 304 420 L 424 480 L 304 540 L 184 480 Z" fill="#FDF7EC" stroke="#CFC7BB" stroke-width="1.4"/>
<text x="304" y="475" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="500" fill="#050505" text-anchor="middle">Exit code</text>
<text x="304" y="501" font-family="'Geist Mono',monospace" font-size="17" font-weight="400" fill="#625B52" text-anchor="middle">0 / 2 / 4</text>
<text x="477" y="465" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="500" fill="#625B52" text-anchor="start">0</text>
<text x="321" y="580" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="500" fill="#625B52" text-anchor="start">2 / 4</text>
<rect x="600" y="418" width="312" height="142" rx="8" fill="#FDF7EC" stroke="#CFC7BB" stroke-width="1.2"/>
<text x="622" y="453" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="600" fill="#050505" text-anchor="start">Review changes</text>
<text x="622" y="483" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#625B52" text-anchor="start">Report · diff · local branch</text>
<text x="622" y="509" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#625B52" text-anchor="start">0 includes partial completion</text>
<rect x="48" y="602" width="512" height="101" rx="8" fill="#FDF7EC" stroke="#CFC7BB" stroke-width="1.2"/>
<text x="70" y="637" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="600" fill="#050505" text-anchor="start">Inspect the stop reason</text>
<text x="70" y="667" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#625B52" text-anchor="start">stderr / saved evidence · 4 retains worktree</text>
<text x="600" y="603" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="500" fill="#050505" text-anchor="start">Merge after your review.</text>
<text x="600" y="634" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" fill="#625B52" text-anchor="start">No automatic push or deploy.</text>
</svg>
</body>
</html>
