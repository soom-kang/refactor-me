name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check source syntax
        run: |
          for file in tool/*.mjs tool/bin/*.mjs tool/src/*.mjs tool/test/*.mjs tool/fixtures/*.mjs; do
            node --check "$file" || exit 1
          done
      - name: Run local tests
        run: node --test tool/test/*.test.mjs
      - name: Check CLI
        run: |
          node tool/bin/refactor-me.mjs help
          node tool/bin/refactor-me.mjs version --json
  go:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tool/go/go.mod
          cache-dependency-path: tool/go/go.mod
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Format, test, vet and build
        working-directory: tool/go
        run: |
          test -z "$(gofmt -l .)"
          go test -race -count=1 ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/refactor-me" ./cmd/refactor-me
          "$RUNNER_TEMP/refactor-me" help
          "$RUNNER_TEMP/refactor-me" version --json
      - name: Check independent release version
        run: |
          bash tool/release/build-macos-arm64.sh --check-tag "v$(cat tool/RELEASE_VERSION)"
          if bash tool/release/build-macos-arm64.sh --check-tag v99.99.99-beta.1; then
            echo "unrelated release tag was accepted" >&2
            exit 1
          fi
      - name: Build and smoke test release archive
        run: |
          bash tool/release/build-macos-arm64.sh "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          shasum -a 256 -c SHA256SUMS
          mkdir unpacked
          unzip -q refactor-me_$(cat "$GITHUB_WORKSPACE/tool/RELEASE_VERSION")_darwin_arm64.zip -d unpacked
          unpacked/refactor-me version --json
          git init -q "$RUNNER_TEMP/install-fixture"
          git -C "$RUNNER_TEMP/install-fixture" -c user.name=Fixture -c user.email=fixture@example.invalid commit -q --allow-empty -m baseline
          unpacked/refactor-me install "$RUNNER_TEMP/install-fixture"
          "$RUNNER_TEMP/install-fixture/.refactor/bin/refactor-me" version --json
          unpacked/refactor-me uninstall "$RUNNER_TEMP/install-fixture"
      - name: Match release tag to independent version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tool/release/build-macos-arm64.sh --check-tag "$RELEASE_TAG"
