name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check source syntax
        run: |
          for file in tool/*.mjs tool/bin/*.mjs tool/src/*.mjs tool/test/*.mjs tool/fixtures/*.mjs; do
            node --check "$file" || exit 1
          done
      - name: Run local tests
        run: node --test tool/test/*.test.mjs
      - name: Check CLI
        run: |
          node tool/bin/refactor-me.mjs help
          node tool/bin/refactor-me.mjs version --json
  go:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tool/go/go.mod
          cache-dependency-path: tool/go/go.mod
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Format, test, vet and build
        working-directory: tool/go
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/refactor-me" ./cmd/refactor-me
          "$RUNNER_TEMP/refactor-me" help
          "$RUNNER_TEMP/refactor-me" version --json
      - name: Match release tag to Go binary version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: tool/go
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]
          release_version="${RELEASE_TAG#v}"
          go build -ldflags "-X main.version=$release_version" -o "$RUNNER_TEMP/refactor-me-release" ./cmd/refactor-me
          actual="$("$RUNNER_TEMP/refactor-me-release" version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          test "$actual" = "$release_version"
