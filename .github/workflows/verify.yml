name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      js_fixture:
        description: Run optional JavaScript target fixture validation
        type: boolean
        default: false
      public_install:
        description: Verify the public Homebrew installation against the selected ref
        type: boolean
        default: false
      upgrade_from_formula:
        description: Optional prior tap commit SHA for upgrade verification (requires public_install)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    needs: [go, js-fixture, public-install]
    if: always()
    steps:
      - name: Aggregate verification
        env:
          GO_RESULT: ${{ needs.go.result }}
          JS_RESULT: ${{ needs.js-fixture.result }}
          JS_REQUESTED: ${{ inputs.js_fixture }}
          PUBLIC_RESULT: ${{ needs.public-install.result }}
          PUBLIC_REQUESTED: ${{ inputs.public_install }}
          UPGRADE_FROM_FORMULA: ${{ inputs.upgrade_from_formula }}
        run: |
          if [ -n "$UPGRADE_FROM_FORMULA" ]; then
            test "$PUBLIC_REQUESTED" = true
          fi
          if [ "$PUBLIC_REQUESTED" = true ]; then
            test "$GO_RESULT" = skipped
          else
            test "$GO_RESULT" = success
          fi
          if [ "$JS_REQUESTED" = true ]; then
            test "$JS_RESULT" = success
          else
            test "$JS_RESULT" = skipped
          fi
          if [ "$PUBLIC_REQUESTED" = true ]; then
            test "$PUBLIC_RESULT" = success
          else
            test "$PUBLIC_RESULT" = skipped
          fi
  public-install:
    if: github.event_name == 'workflow_dispatch' && inputs.public_install
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Prepare the public tap on a clean runner
        run: |
          if brew list --formula | grep -Fxq refactor-me; then
            echo "public-install requires a runner without refactor-me installed" >&2
            exit 1
          fi
          brew tap soom-kang/refactor-me
          brew trust --formula soom-kang/refactor-me/refactor-me
      - name: Install and test the public formula
        if: inputs.upgrade_from_formula == ''
        run: |
          brew install refactor-me
          brew test refactor-me
      - name: Upgrade a prior installation and preserve project state
        if: inputs.upgrade_from_formula != ''
        env:
          UPGRADE_FROM_FORMULA: ${{ inputs.upgrade_from_formula }}
        run: python3 tool/release/verify-upgrade.py "$UPGRADE_FROM_FORMULA"
      - name: Verify public version and commit
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ['GITHUB_WORKSPACE'])
          expected_version = (root / 'tool/RELEASE_VERSION').read_text().strip()
          expected_commit = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
          version = json.loads(subprocess.check_output(['refactor-me', 'version', '--json'], text=True))
          assert (version['name'], version['version'], version['commit'], version['platform'], version['arch']) == (
              'refactor-me', expected_version, expected_commit, 'darwin', 'arm64'), version
          print(json.dumps(version, indent=2))
          PY
  js-fixture:
    if: github.event_name == 'workflow_dispatch' && inputs.js_fixture
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tool/go/go.mod
          cache-dependency-path: tool/go/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate JavaScript target fixture
        working-directory: tool/go
        env:
          REFACTOR_TEST_JS: '1'
        run: go test -count=1 ./internal/fixture
  go:
    if: github.event_name != 'workflow_dispatch' || !inputs.public_install
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tool/go/go.mod
          cache-dependency-path: tool/go/go.mod
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Format, test, vet and build
        run: |
          test -z "$(git ls-files '*.mjs')"
          bash tool/check-no-node.sh bash -e -c '
            cd tool/go
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              gofmt -d .
              exit 1
            fi
            go test -count=1 ./...
            go vet ./...
            go build -o "$RUNNER_TEMP/refactor-me" ./cmd/refactor-me
          '
      - name: Test release packaging
        run: python3 -m unittest discover -s tool/release -p 'test_*.py'
